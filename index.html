<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属能量站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            overflow: hidden; /* 防止特效导致滚动条 */
        }

        /* 动态渐变背景 */
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 毛玻璃效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        }

        /* 句子淡入淡出动画 */
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 漂浮粒子特效 */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            opacity: 0;
            font-size: 1.5rem;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* 自定义复选框样式 */
        input[type="checkbox"] {
            accent-color: #e73c7e;
            width: 1.2rem;
            height: 1.2rem;
            cursor: pointer;
        }
        
        .completed {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center text-white relative">

    <!-- 主卡片 -->
    <main class="glass-card w-11/12 max-w-lg rounded-3xl p-8 md:p-10 relative z-10 flex flex-col gap-6">
        
        <!-- 头部：时间与问候 -->
        <header class="flex justify-between items-center border-b border-white/20 pb-4">
            <div>
                <h1 id="greeting" class="text-2xl md:text-3xl font-bold tracking-wider">你好，追光者！</h1>
                <p id="current-date" class="text-white/80 text-sm mt-1 flex items-center gap-1">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>加载中...</span>
                </p>
            </div>
            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
                <i data-lucide="sun" id="time-icon" class="w-7 h-7 text-yellow-300"></i>
            </div>
        </header>

        <!-- 核心励志语录区 -->
        <section class="min-h-[120px] flex flex-col justify-center items-center text-center gap-4 py-4">
            <i data-lucide="quote" class="w-8 h-8 text-white/40 mb-2"></i>
            <p id="quote-text" class="text-xl md:text-2xl font-medium leading-relaxed tracking-wide fade-in">
                "星光不问赶路人，时光不负有心人。"
            </p>
        </section>

        <!-- 互动按钮 -->
        <div class="flex justify-center relative">
            <button id="energy-btn" class="group relative px-8 py-3 bg-gradient-to-r from-pink-500 to-orange-400 rounded-full font-bold text-lg shadow-[0_0_20px_rgba(236,72,153,0.4)] hover:shadow-[0_0_30px_rgba(236,72,153,0.6)] hover:scale-105 transition-all duration-300 flex items-center gap-2 overflow-hidden">
                <span class="relative z-10">获取能量</span>
                <i data-lucide="zap" class="w-5 h-5 relative z-10 group-hover:animate-pulse"></i>
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
            </button>
        </div>

        <!-- 每日自我肯定清单 -->
        <section class="mt-4 bg-black/10 rounded-2xl p-5 border border-white/10">
            <h2 class="text-sm font-bold text-white/90 uppercase tracking-widest mb-4 flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i> 每日心理暗示
            </h2>
            <ul class="space-y-3" id="affirmation-list">
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="task1">
                    <label for="task1" class="text-md cursor-pointer select-none transition-colors">我今天拥有充沛的精力。</label>
                </li>
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="task2">
                    <label for="task2" class="text-md cursor-pointer select-none transition-colors">我接纳自己的不完美，并持续成长。</label>
                </li>
                <li class="flex items-center gap-3">
                    <input type="checkbox" id="task3">
                    <label for="task3" class="text-md cursor-pointer select-none transition-colors">无论遇到什么困难，我都能找到解决办法。</label>
                </li>
            </ul>
        </section>
        
        <footer class="text-center text-xs text-white/50 mt-2">
            Stay positive. Keep moving forward.
        </footer>
    </main>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 励志语录库
        const quotes = [
            "既然选择了远方，便只顾风雨兼程。",
            "星光不问赶路人，时光不负有心人。",
            "纵有疾风起，人生不言弃。",
            "把所有的不快留给昨天，把所有的希望留给今天。",
            "不要愁老之将至，你老了一定很可爱。",
            "你有多自律，就有多自由。",
            "看似不起眼的日复一日，会在将来的某天，突然让你看到坚持的意义。",
            "向阳而生，逐光而行。心有暖阳，无惧沧桑。",
            "乾坤未定，你我皆是黑马。",
            "那些杀不死我的，只会让我更强大。",
            "与其仰望星空，不如去做那个发光的人。",
            "别让昨天的雨，淋湿今天的衣裳。",
            "做自己的太阳，无需凭借谁的光。"
        ];

        // 能量粒子表情
        const emojis = ['✨', '🔥', '💖', '🌟', '💪', '🚀', '☀️'];

        // DOM 元素
        const greetingEl = document.getElementById('greeting');
        const dateEl = document.getElementById('current-date');
        const timeIconEl = document.getElementById('time-icon');
        const quoteEl = document.getElementById('quote-text');
        const energyBtn = document.getElementById('energy-btn');
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');

        // 设置日期和问候语
        function setTimeAndGreeting() {
            const now = new Date();
            const hour = now.getHours();
            
            // 日期格式化
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            dateEl.innerHTML = `<i data-lucide="calendar" class="w-4 h-4"></i><span>${now.toLocaleDateString('zh-CN', options)}</span>`;
            lucide.createIcons(); // 重新渲染注入的图标

            // 问候语逻辑
            if (hour >= 5 && hour < 9) {
                greetingEl.innerText = "早上好，新的一天！";
                timeIconEl.setAttribute('data-lucide', 'sunrise');
                timeIconEl.classList.replace('text-yellow-300', 'text-orange-300');
            } else if (hour >= 9 && hour < 12) {
                greetingEl.innerText = "上午好，充满活力！";
                timeIconEl.setAttribute('data-lucide', 'sun');
            } else if (hour >= 12 && hour < 14) {
                greetingEl.innerText = "中午好，记得休息！";
                timeIconEl.setAttribute('data-lucide', 'sun');
            } else if (hour >= 14 && hour < 18) {
                greetingEl.innerText = "下午好，继续加油！";
                timeIconEl.setAttribute('data-lucide', 'sun-dim');
                timeIconEl.classList.replace('text-yellow-300', 'text-orange-400');
            } else if (hour >= 18 && hour < 22) {
                greetingEl.innerText = "晚上好，辛苦了！";
                timeIconEl.setAttribute('data-lucide', 'moon');
                timeIconEl.classList.replace('text-yellow-300', 'text-indigo-200');
            } else {
                greetingEl.innerText = "夜深了，早点休息吧。";
                timeIconEl.setAttribute('data-lucide', 'moon-star');
                timeIconEl.classList.replace('text-yellow-300', 'text-indigo-300');
            }
            lucide.createIcons();
        }

        // 随机获取语录
        function getRandomQuote() {
            let newQuote;
            do {
                newQuote = quotes[Math.floor(Math.random() * quotes.length)];
            } while (newQuote === quoteEl.innerText.replace(/"/g, '')); // 避免连续重复
            
            // 触发动画重新播放
            quoteEl.classList.remove('fade-in');
            void quoteEl.offsetWidth; // 触发重绘
            quoteEl.innerText = `"${newQuote}"`;
            quoteEl.classList.add('fade-in');
        }

        // 创建粒子特效
        function createParticles(e) {
            const rect = energyBtn.getBoundingClientRect();
            // 按钮中心点
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // 随机偏移
                const offsetX = (Math.random() - 0.5) * 100;
                
                particle.style.left = `${x + offsetX}px`;
                particle.style.top = `${y}px`;
                
                document.body.appendChild(particle);

                // 动画结束后移除元素
                setTimeout(() => {
                    particle.remove();
                }, 2000);
            }
        }

        // 事件监听
        energyBtn.addEventListener('click', (e) => {
            getRandomQuote();
            createParticles(e);
        });

        // 任务打卡划线效果
        checkboxes.forEach(box => {
            box.addEventListener('change', function() {
                const label = this.nextElementSibling;
                if (this.checked) {
                    label.classList.add('completed');
                    // 打卡时也给一点小反馈
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.innerText = '✨';
                    const rect = this.getBoundingClientRect();
                    particle.style.left = `${rect.left}px`;
                    particle.style.top = `${rect.top}px`;
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 2000);
                } else {
                    label.classList.remove('completed');
                }
            });
        });

        // 初始化
        setTimeAndGreeting();
        getRandomQuote(); // 页面加载时先随机一句
        
        // 每分钟更新一次时间问候
        setInterval(setTimeAndGreeting, 60000);
    </script>
</body>
</html>
